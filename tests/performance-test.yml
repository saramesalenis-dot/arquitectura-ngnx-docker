config:
  target: "http://nginx:80"   # nombre del SERVICIO nginx dentro de la red de Docker
  phases:
    - duration: 30
      arrivalRate: 5
      rampTo: 50
      name: "Calentamiento (ramp up)"
    - duration: 60
      arrivalRate: 50
      name: "Carga sostenida"
scenarios:
  - flow:
      - get:
          url: "/"
